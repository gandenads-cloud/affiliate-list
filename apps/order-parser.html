<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Parser - Sampel Gratis</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-2: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .sheet-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .sheet-box input {
      flex: 1;
      min-width: 260px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #0b1220;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: rgba(96, 165, 250, 0.06);
    }

    .status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .waiting { background: rgba(251, 191, 36, 0.15); color: #fcd34d; }
    .transit { background: rgba(96, 165, 250, 0.15); color: #93c5fd; }
    .sent { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; }
    .cancelled { background: rgba(248, 113, 113, 0.12); color: #fca5a5; }

    .empty {
      color: var(--muted);
      padding: 20px 0;
      text-align: center;
    }

    .codebox {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

    <h1>Order Parser - Sampel Gratis</h1>

    <div class="topbar">

      <button id="saveSheetUrlBtn" type="button">Simpan URL</button>
    </div>

    <div class="toolbar">
      <span class="meta" id="meta">Belum ada data yang diparse.</span>

          <th>Status</th>
        </tr>

    </table>

    <div class="codebox" id="csvBox"></div>
  </div>

    function normalizeText(input) {
      return input
        .replace(/&amp;/g, '&')
        .replace(/&nbsp;/gi, ' ')
        .replace(/\u00a0/g, ' ')
        .replace(/\r/g, '')
        .replace(/\n\s*\n/g, '\n');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function statusClass(status) {
      const s = String(status || '').toLowerCase();
      if (s.includes('menunggu')) return 'waiting';
      if (s.includes('transit')) return 'transit';
      if (s.includes('terkirim')) return 'sent';
      if (s.includes('dibatalkan') || s.includes('belum dibayar')) return 'cancelled';
      return 'waiting';
    }

    function parseEntries(rawText) {
      const text = normalizeText(rawText);
      const entries = [];
      const sampleRegex = /Sampel\s+gratis/gi;

      let match;
      while ((match = sampleRegex.exec(text)) !== null) {
        const sampleIndex = match.index;
        const nextSampleIndex = text.slice(sampleIndex + match[0].length).search(/Sampel\s+gratis/i);
        const blockEnd = nextSampleIndex === -1 ? text.length : sampleIndex + match[0].length + nextSampleIndex;
        const block = text.slice(sampleIndex, blockEnd);

        const datePattern = /(?:Hari ini|Senin|Selasa|Rabu|Kamis|Jumat|Sabtu|Minggu)\s+\d{1,2}(?:[.:]\d{2}){1,2}|\d+\s+mnt\s+yang\s+lalu|\d{1,2}[./]\d{1,2}[./]\d{2,4}\s+\d{1,2}:\d{2}:\d{2}/i;
        const dateMatch = block.match(datePattern);
        const date = dateMatch ? dateMatch[0].trim() : '-';

        const afterSample = block.replace(/^Sampel\s+gratis\s*/i, '');
        const strippedBeforeUser = afterSample.replace(/^\s*(?:\d+\s*mnt\s*yang\s*lalu|\d+\s+mnt\s+yang\s+lalu|(?:Hari ini|Senin|Selasa|Rabu|Kamis|Jumat|Sabtu|Minggu)\s+\d{1,2}(?:[.:]\d{2}){1,2}|\d{1,2}[./]\d{1,2}[./]\d{2,4}\s+\d{1,2}:\d{2}:\d{2})\s*/i, '');
        const usernameMatch = strippedBeforeUser.match(/^([A-Za-z0-9_.-]+)(?=\s*(?:\d+\s+)?produk\b|$)/m)
          || strippedBeforeUser.match(/^([A-Za-z0-9_.-]+?)(?=\s+produk(?=\s|[A-Z])|$)/i);
        const username = usernameMatch ? usernameMatch[1].trim() : '-';

        const beforeSample = text.slice(0, sampleIndex);
        const previousNumbers = Array.from(beforeSample.matchAll(/(?:Total|Rp)(\d{12,19})/gi));
        const directOrderNumbers = Array.from(beforeSample.matchAll(/(\d{12,19})/g));
        const orderId = previousNumbers.length
          ? previousNumbers[previousNumbers.length - 1][1]
          : directOrderNumbers.length
            ? directOrderNumbers[directOrderNumbers.length - 1][1]
            : '-';

        const resiMatch = block.match(/JY\d{8,}/i);
        const resi = resiMatch ? resiMatch[0] : '-';

        const statusMatch = block.match(/Menunggu pengiriman|Menunggu pengambilan|Sedang transit|Terkirim|Belum Dibayar|Dibatalkan/i);
        const status = statusMatch ? statusMatch[0] : '-';

        const payload = {
          username,
          id_pesanan: orderId,
          nomor_resi: resi,
          tanggal_kirim: date,
          status_pengiriman: status
        };

        if (username !== '-') {
          entries.push(payload);
        }
      }

      return entries.filter((item, idx, arr) => {
        const key = `${item.username}|${item.id_pesanan}|${item.nomor_resi}`;
        return arr.findIndex(x => `${x.username}|${x.id_pesanan}|${x.nomor_resi}` === key) === idx;
      });
    }

    function buildCsv(entries) {
      return [
        ['username', 'id_pesanan', 'nomor_resi', 'tanggal_kirim', 'status_pengiriman'],
        ...entries.map(item => [item.username, item.id_pesanan, item.nomor_resi, item.tanggal_kirim, item.status_pengiriman])
      ].map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    }

    function renderTable(entries) {
      if (!entries.length) {
        rowsEl.innerHTML = '<tr><td colspan="5" class="empty">Tidak ada data valid yang ditemukan. Pastikan teks yang di-paste benar.</td></tr>';
        csvBox.textContent = '';
        metaEl.textContent = '0 data ditemukan';
        return;
      }

      rowsEl.innerHTML = entries.map(item => `
        <tr>
          <td>${escapeHtml(item.username)}</td>
          <td>${escapeHtml(item.id_pesanan)}</td>
          <td>${escapeHtml(item.nomor_resi)}</td>
          <td>${escapeHtml(item.tanggal_kirim)}</td>
          <td><span class="status ${statusClass(item.status_pengiriman)}">${escapeHtml(item.status_pengiriman)}</span></td>
        </tr>
      `).join('');

      const csvText = buildCsv(entries);
      csvBox.textContent = csvText;
      metaEl.textContent = `${entries.length} data berhasil diparse. CSV siap dipakai.`;
    }

    document.getElementById('parseBtn').addEventListener('click', () => {
      const entries = parseEntries(rawData.value);
      renderTable(entries);

      if (entries.length) {
        const csvText = buildCsv(entries);
        navigator.clipboard.writeText(csvText).catch(() => {});
      }
    });

    document.getElementById('loadExample').addEventListener('click', () => {
      rawData.value = exampleText;
      const entries = parseEntries(exampleText);
      renderTable(entries);

      if (entries.length) {
        const csvText = buildCsv(entries);
        navigator.clipboard.writeText(csvText).catch(() => {});
      }
    });

    document.getElementById('copyCsv').addEventListener('click', async () => {
      const text = csvBox.textContent.trim();
      if (!text) {
        alert('Belum ada data CSV hasil parse.');
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        alert('CSV berhasil di-copy ke clipboard.');
      } catch (error) {
        alert('Clipboard gagal dipakai. Silakan copy manual dari box CSV.');
      }
    });

    document.getElementById('saveSheetUrlBtn').addEventListener('click', () => {
      const url = sheetUrlInput.value.trim();
      if (!url) {
        alert('Masukkan URL Apps Script Web App terlebih dahulu.');
        return;
      }
      localStorage.setItem(SHEET_URL_KEY, url);
      alert('URL spreadsheet berhasil disimpan.');
    });

    async function sendDataToSheet(entries) {
      const url = sheetUrlInput.value.trim();
      if (!url) {
        alert('Masukkan URL connector lokal terlebih dahulu, misalnya http://localhost:8765/append.');
        return;
      }

      if (!entries.length) {
        alert('Belum ada data untuk dikirim.');
        return;
      }

      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          mode: 'cors',
          body: JSON.stringify({ rows: entries })
        });
        alert('Data berhasil dikirim ke spreadsheet via connector lokal.');
      } catch (error) {
        alert('Gagal mengirim data ke spreadsheet. Pastikan connector lokal sedang berjalan di http://localhost:8765/append.');
      }
    }

    document.getElementById('sendSheetBtn').addEventListener('click', async () => {
      const entries = parseEntries(rawData.value);
      renderTable(entries);
      await sendDataToSheet(entries);
    });

    rawData.value = exampleText;
    renderTable(parseEntries(exampleText));
  </script>
</body>
