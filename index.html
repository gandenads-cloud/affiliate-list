<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiliate Creator List</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e8ec;--dim:#8b93a3;--acc:#4a9eff}
  @media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--fg:#1a1d23;--dim:#6b7280;--acc:#1c6fd4}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:3}
  h1{margin:0 0 10px;font-size:17px;font-weight:600}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
  input[type=search]{min-width:240px;flex:1}
  .count{color:var(--dim);font-size:13px;margin-left:auto}
  .wrap{overflow:auto;max-height:calc(100vh - 92px)}
  table{border-collapse:collapse;width:100%;white-space:nowrap}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;font-weight:600;font-size:12px;
     text-transform:uppercase;letter-spacing:.03em;color:var(--dim)}
  th:hover{color:var(--fg)}
  th.sorted{color:var(--acc)}
  tbody tr:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  a{color:var(--acc)}
  .nm{font-weight:600}
  .un{color:var(--dim);font-size:12px}
  .star{color:#f5a623}
  #err{padding:20px;color:#ff6b6b}
  details.bio{max-width:340px;white-space:normal}
  details.bio summary{cursor:pointer;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Affiliate Creator List</h1>
  <div class="bar">
    <input type="search" id="q" placeholder="Cari nama, username, bio, MCN…">
    <select id="kat"><option value="">Semua kategori</option></select>
    <select id="lvl"><option value="">Semua level</option></select>
    <select id="mcn"><option value="">Semua MCN</option></select>
    <label style="color:var(--dim)"><input type="checkbox" id="starOnly"> Star creator</label>
    <span class="count" id="count"></span>
  </div>
</header>
<div class="wrap"><table>
  <thead><tr id="head"></tr></thead>
  <tbody id="body"></tbody>
</table></div>
<div id="err" hidden>
  <p><b>CSV belum ke-load.</b> Browser blokir baca file lokal kalau halaman dibuka langsung.</p>
  <p>Pilih file <code>affiliate_data.csv</code> di bawah (atau drag ke halaman ini):</p>
  <p><input type="file" id="file" accept=".csv"></p>
  <p style="color:var(--dim)">Atau jalankan <code>./start.sh</code> di folder ini biar auto-load.</p>
</div>

<script>
// ---- CSV parser (RFC4180: quotes, embedded commas/newlines) ----
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f='' }
    else if(c==='\n'){ row.push(f); f=''; rows.push(row); row=[] }
    else if(c!=='\r') f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row) }
  return rows.filter(r=>r.length>1);
}

// ---- Indonesian number parser: "679,6 rb" "Rp1,2M" "35,22 rb" "8%" "Rp0-Rp89,4rb" ----
const MULT={rb:1e3,ribu:1e3,jt:1e6,juta:1e6,m:1e9,miliar:1e9,b:1e9};
function num(s){
  if(!s) return null;
  const m = String(s).replace(/\./g,'').match(/(\d+(?:,\d+)?)\s*(rb|ribu|jt|juta|miliar|[mb])?/i);
  if(!m) return null;
  const v = parseFloat(m[1].replace(',','.'));
  return isNaN(v) ? null : v * (MULT[(m[2]||'').toLowerCase()] || 1);
}
const fmt = n => n==null ? '' : n>=1e9 ? (n/1e9).toFixed(2)+' M'
  : n>=1e6 ? (n/1e6).toFixed(1)+' jt' : n>=1e3 ? (n/1e3).toFixed(1)+' rb'
  : (Math.round(n*100)/100).toString();

// ---- columns: [header, csvKey, kind] kind: t=text n=number ----
const COLS=[
  ['Creator','nama','nm'],
  ['Lvl','level','n'],
  ['Pengikut','pengikut','n'],
  ['GMV','gmv','n'],
  ['Terjual','produk_terjual','n'],
  ['GPM','gpm','n'],
  ['GMV/pembeli','gmv_per_pembeli','n'],
  ['Komisi %','komisi_pct','n'],
  ['Peluang %','peluang_posting','n'],
  ['Live %','gmv_live_pct','n'],
  ['Video %','gmv_video_pct','n'],
  ['Video','jml_video','n'],
  ['Tayang/vid','avg_tayangan_video','n'],
  ['Eng vid %','engagement_video_pct','n'],
  ['Live','jml_live','n'],
  ['Tayang/live','avg_tayangan_live','n'],
  ['Eng live %','engagement_live_pct','n'],
  ['Wanita %','perempuan_pct','n'],
  ['MCN','mcn','t'],
  ['Kategori','kategori_folder','t'],
  ['Bio','bio','bio'],
];

let rows=[], sort={key:'gmv',dir:-1};

fetch('affiliate_data.csv')
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text() })
  .then(txt=>{
    const [hdr,...data]=parseCSV(txt);
    rows=data.map(r=>Object.fromEntries(hdr.map((h,i)=>[h.trim(),(r[i]||'').trim()])));
    rows.forEach(r=>{ COLS.forEach(([,k,kind])=>{ if(kind==='n') r['_'+k]=num(r[k]) }) });
    fillSelect('kat','kategori_folder'); fillSelect('lvl','level'); fillSelect('mcn','mcn');
    buildHead(); render();
  })
  .catch(()=>{ document.getElementById('err').hidden=false });  // file:// blocks fetch → picker fallback

// fallback: pilih / drag CSV manual (dipakai saat dibuka langsung tanpa server)
function load(file){
  const fr=new FileReader();
  fr.onload=()=>{
    const [hdr,...data]=parseCSV(fr.result);
    rows=data.map(r=>Object.fromEntries(hdr.map((h,i)=>[h.trim(),(r[i]||'').trim()])));
    rows.forEach(r=>{ COLS.forEach(([,k,kind])=>{ if(kind==='n') r['_'+k]=num(r[k]) }) });
    fillSelect('kat','kategori_folder'); fillSelect('lvl','level'); fillSelect('mcn','mcn');
    document.getElementById('err').hidden=true;
    buildHead(); render();
  };
  fr.readAsText(file);
}
document.getElementById('file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) load(f) });

function fillSelect(id,key){
  const sel=document.getElementById(id);
  [...new Set(rows.map(r=>r[key]).filter(Boolean))].sort()
    .forEach(v=>sel.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));
}

function buildHead(){
  document.getElementById('head').innerHTML = COLS.map(([h,k])=>
    `<th data-k="${k}" class="${sort.key===k?'sorted':''}">${h}${sort.key===k?(sort.dir>0?' ▲':' ▼'):''}</th>`
  ).join('');
  document.querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    sort = sort.key===k ? {key:k,dir:-sort.dir} : {key:k,dir:-1};
    buildHead(); render();
  });
}

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const kat=document.getElementById('kat').value, lvl=document.getElementById('lvl').value;
  const mcn=document.getElementById('mcn').value, star=document.getElementById('starOnly').checked;

  let out=rows.filter(r=>
    (!kat||r.kategori_folder===kat) && (!lvl||r.level===lvl) && (!mcn||r.mcn===mcn) &&
    (!star||/^ya$/i.test(r.star_creator)) &&
    (!q||[r.nama,r.username,r.bio,r.mcn,r.kategori].join(' ').toLowerCase().includes(q))
  );

  const kind=(COLS.find(c=>c[1]===sort.key)||[])[2];
  out.sort((a,b)=>{
    if(kind==='n'){
      const x=a['_'+sort.key], y=b['_'+sort.key];
      if(x==null) return 1; if(y==null) return -1;   // nulls last, both directions
      return (x-y)*sort.dir;
    }
    return String(a[sort.key]||'').localeCompare(String(b[sort.key]||''),'id')*sort.dir;
  });

  document.getElementById('count').textContent=`${out.length} / ${rows.length} creator`;
  document.getElementById('body').innerHTML = out.map(r=>'<tr>'+COLS.map(([,k,kind])=>{
    if(kind==='nm') return `<td><div class="nm">${/^ya$/i.test(r.star_creator)?'<span class="star">★</span> ':''}`+
      `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.nama||r.username)}</a></div>`+
      `<div class="un">@${esc(r.username)}</div></td>`;
    if(kind==='bio') return `<td>${r.bio?`<details class="bio"><summary>bio</summary>${esc(r.bio)}</details>`:''}</td>`;
    if(kind==='n') return `<td class="num" title="${esc(r[k])}">${fmt(r['_'+k])}</td>`;
    return `<td>${esc(r[k])}</td>`;
  }).join('')+'</tr>').join('');
}

['q','kat','lvl','mcn','starOnly'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener(el.tagName==='INPUT'&&el.type==='search'?'input':'change',render);
});
</script>
</body>
</html>
