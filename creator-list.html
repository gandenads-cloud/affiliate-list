<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creator List</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .box {
      width: min(520px, 92vw);
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.3);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }
    a {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
    }
    .small {
      margin-top: 18px;
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Creator List</h1>
    <p>Halaman ini adalah halaman khusus untuk daftar creator. Klik tombol di bawah untuk membuka versi lengkapnya.</p>
    <a href="affiliate-list.html">Buka Creator List</a>
    <a class="small" href="index.html">← Kembali ke launcher</a>
  </div>
</body>
</html>
